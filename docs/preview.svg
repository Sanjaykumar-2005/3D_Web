<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="AURALIS hero section preview">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.6" stop-color="#a85bff"/>
      <stop offset="1" stop-color="#ff5bd1"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a85bff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a85bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4dd5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4dd5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#a85bff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a85bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emitCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#4dd5ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4dd5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="frameStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1600" height="900" fill="#04050b"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="320" cy="180" rx="620" ry="380" fill="url(#glowA)"/>
  <ellipse cx="1320" cy="240" rx="640" ry="400" fill="url(#glowB)"/>
  <ellipse cx="800" cy="940" rx="700" ry="360" fill="url(#glowC)"/>

  <!-- Particle field -->
  <g fill="#5b8cff" opacity="0.55">
    <circle cx="120" cy="120" r="1.4"/><circle cx="240" cy="80" r="1"/>
    <circle cx="380" cy="200" r="1.2"/><circle cx="520" cy="60" r="1"/>
    <circle cx="80" cy="320" r="1.4"/><circle cx="180" cy="500" r="1"/>
    <circle cx="320" cy="580" r="1.4"/><circle cx="80" cy="700" r="1.2"/>
    <circle cx="200" cy="780" r="1"/><circle cx="540" cy="780" r="1.4"/>
    <circle cx="660" cy="720" r="1"/><circle cx="780" cy="820" r="1.2"/>
    <circle cx="940" cy="780" r="1"/><circle cx="1120" cy="760" r="1.4"/>
    <circle cx="1320" cy="820" r="1"/><circle cx="1500" cy="700" r="1.2"/>
    <circle cx="1480" cy="500" r="1"/><circle cx="1540" cy="320" r="1.4"/>
    <circle cx="1380" cy="160" r="1"/><circle cx="1240" cy="80" r="1.2"/>
    <circle cx="1100" cy="140" r="1"/><circle cx="960" cy="80" r="1.4"/>
    <circle cx="700" cy="160" r="1"/><circle cx="580" cy="220" r="1"/>
  </g>
  <g fill="#a85bff" opacity="0.6">
    <circle cx="160" cy="200" r="1.6"/><circle cx="420" cy="380" r="1.2"/>
    <circle cx="100" cy="600" r="1.4"/><circle cx="280" cy="660" r="1"/>
    <circle cx="640" cy="600" r="1.4"/><circle cx="1180" cy="540" r="1.2"/>
    <circle cx="1380" cy="420" r="1.4"/><circle cx="1500" cy="200" r="1"/>
    <circle cx="1040" cy="780" r="1.2"/><circle cx="1240" cy="700" r="1.4"/>
  </g>

  <!-- Cursor glow blob -->
  <ellipse cx="1100" cy="500" rx="320" ry="320" fill="url(#glowB)" opacity="0.35"/>

  <!-- Top nav -->
  <g transform="translate(160 56)">
    <rect width="1280" height="60" rx="30" fill="#0a0d22" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.18"/>
    <!-- brand -->
    <rect x="22" y="15" width="30" height="30" rx="8" fill="url(#brand)"/>
    <circle cx="37" cy="30" r="6" fill="#04050b"/>
    <text x="64" y="37" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#e8ecff">AURALIS</text>
    <!-- nav links -->
    <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a7afd6">
      <rect x="476" y="20" width="80" height="22" rx="11" fill="#5b8cff" fill-opacity="0.18" stroke="#5b8cff" stroke-opacity="0.32"/>
      <text x="516" y="36" text-anchor="middle" fill="#ffffff">Products</text>
      <text x="600" y="36" text-anchor="middle">Technology</text>
      <text x="700" y="36" text-anchor="middle">Experience</text>
      <text x="790" y="36" text-anchor="middle">Reviews</text>
      <text x="868" y="36" text-anchor="middle">Contact</text>
    </g>
    <!-- icons -->
    <circle cx="1080" cy="30" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="1124" cy="30" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- cta -->
    <rect x="1156" y="14" width="106" height="32" rx="16" fill="url(#brand)"/>
    <text x="1209" y="34" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Pre-Order</text>
  </g>

  <!-- Scroll progress bar -->
  <rect x="0" y="0" width="240" height="2" fill="url(#brand)"/>

  <!-- LEFT — copy block -->
  <g transform="translate(160 230)">
    <!-- eyebrow -->
    <g>
      <rect width="270" height="34" rx="17" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="20" cy="17" r="3.5" fill="#4dd5ff"/>
      <text x="38" y="22" font-family="Outfit, system-ui, sans-serif" font-size="11" letter-spacing="3.5" fill="#a7afd6">NEXT-GEN SPATIAL AUDIO</text>
    </g>

    <!-- headline -->
    <text x="0" y="140" font-family="Outfit, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#e8ecff">Sound,</text>
    <text x="0" y="234" font-family="Outfit, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#brand)">reimagined</text>
    <text x="500" y="234" font-family="Outfit, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#e8ecff"> in 3D.</text>

    <!-- subtitle -->
    <text x="0" y="290" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#a7afd6">Premium audio engineered with adaptive noise sculpting, dynamic</text>
    <text x="0" y="316" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#a7afd6">spatial imaging, and titanium-grade acoustics.</text>

    <!-- CTAs -->
    <g transform="translate(0 354)">
      <rect width="220" height="50" rx="25" fill="url(#brand)"/>
      <text x="110" y="31" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Explore the Lineup  →</text>
      <g transform="translate(238 0)">
        <rect width="172" height="50" rx="25" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.18"/>
        <polygon points="22,16 22,34 38,25" fill="#e8ecff"/>
        <text x="100" y="31" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8ecff">Watch Demo</text>
      </g>
    </g>

    <!-- stats -->
    <g transform="translate(0 460)">
      <g>
        <rect width="125" height="86" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="44" font-family="Outfit, system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#brand)">42h</text>
        <text x="20" y="68" font-family="Outfit, system-ui, sans-serif" font-size="9" letter-spacing="2.5" fill="#6b73a0">BATTERY</text>
      </g>
      <g transform="translate(140 0)">
        <rect width="125" height="86" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="44" font-family="Outfit, system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#brand)">-38dB</text>
        <text x="20" y="68" font-family="Outfit, system-ui, sans-serif" font-size="9" letter-spacing="2.5" fill="#6b73a0">NOISE FLOOR</text>
      </g>
      <g transform="translate(280 0)">
        <rect width="125" height="86" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="20" y="44" font-family="Outfit, system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#brand)">360°</text>
        <text x="20" y="68" font-family="Outfit, system-ui, sans-serif" font-size="9" letter-spacing="2.5" fill="#6b73a0">SPATIAL</text>
      </g>
    </g>
  </g>

  <!-- RIGHT — 3D visual frame -->
  <g transform="translate(900 220)">
    <rect width="560" height="560" rx="40" fill="#07091a" fill-opacity="0.55" stroke="url(#frameStroke)"/>
    <ellipse cx="170" cy="160" rx="240" ry="240" fill="url(#glowA)"/>
    <ellipse cx="400" cy="400" rx="240" ry="240" fill="url(#glowB)"/>

    <!-- headphone -->
    <g transform="translate(280 290)">
      <!-- headband (dark) -->
      <path d="M -190 -30 A 195 195 0 0 1 190 -30" stroke="#1a1f3d" stroke-width="22" fill="none" stroke-linecap="round"/>
      <!-- headband neon highlight -->
      <path d="M -190 -30 A 195 195 0 0 1 190 -30" stroke="#a85bff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.95"/>

      <!-- left earcup -->
      <g transform="translate(-170 38)">
        <ellipse cx="0" cy="0" rx="78" ry="62" fill="#0c1024" stroke="#1a1f3d" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="66" ry="52" fill="none" stroke="#a85bff" stroke-width="3" opacity="0.95"/>
        <ellipse cx="0" cy="0" rx="38" ry="30" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.6"/>
        <circle cx="0" cy="0" r="22" fill="url(#emit)"/>
        <circle cx="0" cy="0" r="6" fill="#ffffff"/>
      </g>
      <!-- right earcup -->
      <g transform="translate(170 38)">
        <ellipse cx="0" cy="0" rx="78" ry="62" fill="#0c1024" stroke="#1a1f3d" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="66" ry="52" fill="none" stroke="#a85bff" stroke-width="3" opacity="0.95"/>
        <ellipse cx="0" cy="0" rx="38" ry="30" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.6"/>
        <circle cx="0" cy="0" r="22" fill="url(#emitCyan)"/>
        <circle cx="0" cy="0" r="6" fill="#ffffff"/>
      </g>
    </g>

    <!-- floating badges -->
    <g transform="translate(-22 92)">
      <rect width="190" height="64" rx="16" fill="#0a0d22" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="22" cy="32" r="5" fill="#4dd5ff"/>
      <circle cx="22" cy="32" r="8" fill="#4dd5ff" fill-opacity="0.3"/>
      <text x="42" y="26" font-family="Outfit, system-ui, sans-serif" font-size="9" letter-spacing="2.4" fill="#6b73a0">ANC ACTIVE</text>
      <text x="42" y="46" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8ecff">Adaptive Mode</text>
    </g>

    <g transform="translate(412 432)">
      <rect width="190" height="64" rx="16" fill="#0a0d22" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.18"/>
      <g transform="translate(20 22)" stroke="#4dd5ff" stroke-width="2" fill="none" stroke-linecap="round">
        <line x1="0" y1="10" x2="0" y2="10"/>
        <path d="M -2 14 Q 4 14 4 8 Q 4 2 14 2"/>
      </g>
      <text x="46" y="26" font-family="Outfit, system-ui, sans-serif" font-size="9" letter-spacing="2.4" fill="#6b73a0">LOSSLESS</text>
      <text x="46" y="46" font-family="Outfit, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8ecff">24-bit / 192 kHz</text>
    </g>

    <!-- drag hint -->
    <g transform="translate(210 524)">
      <rect width="140" height="26" rx="13" fill="#04050b" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="70" y="17" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="9" letter-spacing="2.4" fill="#a7afd6">↻  DRAG TO ROTATE</text>
    </g>
  </g>

  <!-- scroll hint at bottom -->
  <g transform="translate(800 850)">
    <rect x="-12" y="-26" width="24" height="40" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="-2" y="-22" width="4" height="8" rx="2" fill="#5b8cff"/>
    <text y="32" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="10" letter-spacing="3" fill="#6b73a0">SCROLL</text>
  </g>
</svg>
